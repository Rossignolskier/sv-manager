---
- name: DEBUG
  debug:
    var: jito

- name: DEBUG
  debug:
    var: paladin

- name: DEBUG
  debug:
    var: agave

# - name: Stop play
#   meta: end_play

- name: Set release params
  set_fact:
    release_label: "agave-{{ cli_version }}"
    tag: "tags/v{{ cli_version }}"
    git_url: https://github.com/anza-xyz/agave.git
    repo_name: "agave"
  when: not jito and not paladin

- name: Set release params
  set_fact:
    release_label: "jito-{{ cli_version }}"
    tag: "tags/v{{ cli_version }}-jito"
    git_url: "https://github.com/jito-foundation/jito-solana.git"
    repo_name: "jito"
  when: jito

- name: Set release params
  set_fact:
    release_label: "paladin-{{ cli_version }}"
    tag: "tags/v{{ cli_version }}-paladin"
    git_url: "https://github.com/paladin-bladesmith/paladin-solana.git"
    repo_name: "paladin"
  when: paladin


- name: Clone {{ repo_name }} repo
  git:
    dest: "{{ git_clone_target }}/{{ repo_name }}"
    force: true
    repo: "{{ git_url }}"
    version: "{{ tag }}"
    recursive: yes
  become: true
  become_user: "{{ solana_user }}"
  tags:
    - cli
    - cli.sources

